<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Aspect Transformation (light theme)</title>
  <!-- An aspect color wheel transformed (arrow) into classified blocks: the
       tool reclassifies / transforms aspect. -->
  <g stroke="#ffffff" stroke-width="0.4">
    <path d="M9 11 L9 3.5 A7.5 7.5 0 0 1 14.3 5.7 Z" fill="#E64A45"/>
    <path d="M9 11 L14.3 5.7 A7.5 7.5 0 0 1 16.5 11 Z" fill="#EE8B3D"/>
    <path d="M9 11 L16.5 11 A7.5 7.5 0 0 1 14.3 16.3 Z" fill="#E7C63B"/>
    <path d="M9 11 L14.3 16.3 A7.5 7.5 0 0 1 9 18.5 Z" fill="#8FC24A"/>
    <path d="M9 11 L9 18.5 A7.5 7.5 0 0 1 3.7 16.3 Z" fill="#3FB6A6"/>
    <path d="M9 11 L3.7 16.3 A7.5 7.5 0 0 1 1.5 11 Z" fill="#3E8FD0"/>
    <path d="M9 11 L1.5 11 A7.5 7.5 0 0 1 3.7 5.7 Z" fill="#6A5CC0"/>
    <path d="M9 11 L3.7 5.7 A7.5 7.5 0 0 1 9 3.5 Z" fill="#C554A6"/>
  </g>
  <circle cx="9" cy="11" r="1.8" fill="#2B2B2B"/>
  <!-- transform arrow -->
  <path d="M18 22 L24 22 M22 20 L24 22 L22 24" stroke="#2B2B2B" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- classified blocks -->
  <rect x="25" y="17" width="5" height="5" fill="#E64A45"/>
  <rect x="25" y="22" width="5" height="5" fill="#3FB6A6"/>
</svg>
