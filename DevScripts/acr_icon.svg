<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Arc-Chord Ratio (ACR)</title>
  <!-- The "arc" (the rugged terrain surface) drawn over its "chord" (the
       tilted plane of best fit through the two boundary points): ACR is the
       ratio of the arc's area to the chord's, so a smooth tilted plane reads
       as 1 and only genuine roughness raises the value. The red dashed line
       is the plane of best fit; the red dots are the boundary data that
       define it. -->
  <path d="M 3 25 L 7 18 L 11 22 L 15 12 L 19 17 L 23 8 L 26 13 L 29 10 L 29 29 L 3 29 Z"
        fill="#8C8C8C" stroke="#000000" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="3" y1="25" x2="29" y2="10" stroke="#C0392B" stroke-width="1.8"
        stroke-dasharray="3 2" stroke-linecap="round"/>
  <circle cx="3" cy="25" r="2" fill="#C0392B"/>
  <circle cx="29" cy="10" r="2" fill="#C0392B"/>
</svg>
