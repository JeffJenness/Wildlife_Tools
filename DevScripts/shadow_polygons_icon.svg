<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Create Shadow Polygons</title>
  <!-- Concentric fading black rings around a solid center: the shadow effect. -->
  <circle cx="16" cy="16" r="15" fill="#000000" fill-opacity="0.15"/>
  <circle cx="16" cy="16" r="12" fill="#000000" fill-opacity="0.22"/>
  <circle cx="16" cy="16" r="9"  fill="#000000" fill-opacity="0.30"/>
  <circle cx="16" cy="16" r="6.5" fill="#FFD400" stroke="#000000" stroke-width="1.5"/>
</svg>
