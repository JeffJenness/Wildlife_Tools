<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Topographic Position Index (TPI)</title>
  <!-- A single hill in cross-section shaded continuously from valley (blue,
       low TPI) up to ridge (red, high TPI): the raw, continuous Topographic
       Position Index. -->
  <defs>
    <linearGradient id="tpigrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2c7bb6"/>
      <stop offset="0.30" stop-color="#a6d96a"/>
      <stop offset="0.60" stop-color="#ffffbf"/>
      <stop offset="0.80" stop-color="#fdae61"/>
      <stop offset="1" stop-color="#d7191c"/>
    </linearGradient>
  </defs>
  <path d="M 2 29 C 8 28 11 8 16 6.5 C 21 8 24 28 30 29 Z"
        fill="url(#tpigrad)" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
