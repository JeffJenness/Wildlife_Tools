<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>LSRI on Contours</title>
  <!-- Same two bold contour-like lines and solid neighborhood circle as
       the DEM variant, but with vertex dots on the lines (an existing
       vector dataset) instead of raster-cell squares (a DEM). -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#000000" stroke-width="2.2"/>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 4 12 Q 11 7.5 16 12 T 28 12"/>
    <path d="M 4 21 Q 11 25.5 16 21 T 28 21"/>
  </g>
  <g fill="#000000">
    <circle cx="4" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="28" cy="12" r="1.6"/>
    <circle cx="4" cy="21" r="1.6"/><circle cx="16" cy="21" r="1.6"/><circle cx="28" cy="21" r="1.6"/>
  </g>
</svg>
