<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Topography along Lines</title>
  <!-- A polyline traversing a terrain profile: the analysis line follows the
       ground surface up and over the hills; the dots are elevation samples; the
       arrowhead marks the line's direction of travel (first vertex to last). -->
  <path d="M 2 25 L 8 14 L 14 21 L 20 10 L 26 17 L 30 12 L 30 29 L 2 29 Z"
        fill="#9AA0A6" stroke="none"/>
  <polyline points="2,25 8,14 14,21 20,10 26,17 30,12" fill="none"
            stroke="#E8730C" stroke-width="1.9" stroke-linejoin="round"
            stroke-linecap="round" marker-end="url(#tl_ah)"/>
  <g fill="#1F3A5F">
    <circle cx="2" cy="25" r="1.5"/><circle cx="8" cy="14" r="1.5"/>
    <circle cx="14" cy="21" r="1.5"/><circle cx="20" cy="10" r="1.5"/>
    <circle cx="26" cy="17" r="1.5"/>
  </g>
  <defs>
    <marker id="tl_ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#E8730C"/>
    </marker>
  </defs>
</svg>
