<?xml version="1.0" encoding="UTF-8"?>
<!-- Sudoku ribbon icon (dark theme): parchment tile, 9-grid with heavy
     3x3 lines, three ink digits. Render at 16 and 32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="3.6"
        fill="#3A3A3A" stroke="#E8DFC8" stroke-width="2.2"/>
  <!-- thin 9-grid lines -->
  <g stroke="#B8A878" stroke-width="0.7" opacity="0.85">
    <line x1="11.2" y1="3.4" x2="11.2" y2="28.6"/>
    <line x1="20.8" y1="3.4" x2="20.8" y2="28.6"/>
    <line x1="3.4" y1="11.2" x2="28.6" y2="11.2"/>
    <line x1="3.4" y1="20.8" x2="28.6" y2="20.8"/>
    <line x1="7.9" y1="3.4" x2="7.9" y2="28.6" opacity="0.5"/>
    <line x1="14.5" y1="3.4" x2="14.5" y2="28.6" opacity="0.5"/>
    <line x1="17.5" y1="3.4" x2="17.5" y2="28.6" opacity="0.5"/>
    <line x1="24.1" y1="3.4" x2="24.1" y2="28.6" opacity="0.5"/>
    <line x1="3.4" y1="7.9" x2="28.6" y2="7.9" opacity="0.5"/>
    <line x1="3.4" y1="14.5" x2="28.6" y2="14.5" opacity="0.5"/>
    <line x1="3.4" y1="17.5" x2="28.6" y2="17.5" opacity="0.5"/>
    <line x1="3.4" y1="24.1" x2="28.6" y2="24.1" opacity="0.5"/>
  </g>
  <!-- heavy 3x3 lines -->
  <g stroke="#E8DFC8" stroke-width="1.6">
    <line x1="11.2" y1="2.7" x2="11.2" y2="29.3"/>
    <line x1="20.8" y1="2.7" x2="20.8" y2="29.3"/>
    <line x1="2.7" y1="11.2" x2="29.3" y2="11.2"/>
    <line x1="2.7" y1="20.8" x2="29.3" y2="20.8"/>
  </g>
  <!-- digits -->
  <g fill="#F2EAD4" font-family="Georgia, serif" font-weight="bold"
     font-size="8.2" text-anchor="middle">
    <text x="7.3" y="10.1">5</text>
    <text x="16.1" y="19.6">3</text>
    <text x="24.9" y="29.0" fill="#E88A6A">9</text>
  </g>
</svg>
