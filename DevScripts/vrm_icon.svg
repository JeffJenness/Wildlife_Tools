<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>VRM (Vector Ruggedness Measure)</title>
  <!-- A jagged (rugged) terrain profile with short arrows (unit normal
       vectors) pointing in noticeably different directions from points
       along the ridge, visualizing the vector DISPERSION that VRM measures
       (a smooth, evenly-sloped terrain would have near-parallel arrows). -->
  <path d="M 2 26 L 7 14 L 11 20 L 15 6 L 19 18 L 23 10 L 27 22 L 30 16 L 30 27 L 2 27 Z"
        fill="#8C8C8C" stroke="#000000" stroke-width="1.3" stroke-linejoin="round"/>
  <g stroke="#000000" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 7 14 L 4 8" marker-end="url(#ah)"/>
    <path d="M 15 6 L 15 2" marker-end="url(#ah)"/>
    <path d="M 23 10 L 27 5" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>
