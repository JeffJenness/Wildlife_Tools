<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Aspect Tools (light theme)</title>
  <!-- An aspect color wheel: eight directional sectors colored cyclically, the
       classic way an aspect raster is symbolized. A circular variable, hence
       the circular tool family. -->
  <g stroke="#ffffff" stroke-width="0.6">
    <path d="M16 16 L16 3 A13 13 0 0 1 25.2 6.8 Z" fill="#E64A45"/>
    <path d="M16 16 L25.2 6.8 A13 13 0 0 1 29 16 Z" fill="#EE8B3D"/>
    <path d="M16 16 L29 16 A13 13 0 0 1 25.2 25.2 Z" fill="#E7C63B"/>
    <path d="M16 16 L25.2 25.2 A13 13 0 0 1 16 29 Z" fill="#8FC24A"/>
    <path d="M16 16 L16 29 A13 13 0 0 1 6.8 25.2 Z" fill="#3FB6A6"/>
    <path d="M16 16 L6.8 25.2 A13 13 0 0 1 3 16 Z" fill="#3E8FD0"/>
    <path d="M16 16 L3 16 A13 13 0 0 1 6.8 6.8 Z" fill="#6A5CC0"/>
    <path d="M16 16 L6.8 6.8 A13 13 0 0 1 16 3 Z" fill="#C554A6"/>
  </g>
  <circle cx="16" cy="16" r="3.1" fill="#2B2B2B"/>
</svg>
