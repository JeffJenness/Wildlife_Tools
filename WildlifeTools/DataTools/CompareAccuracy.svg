<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Compare Accuracy Analyses: two kappa bars with CI whiskers
       and a Z between them. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <line x1="4" y1="26" x2="28" y2="26" stroke="#4A4A4A"
        stroke-width="1.2"/>
  <!-- bars -->
  <rect x="7" y="12" width="6" height="14" fill="#2E6B8A"/>
  <rect x="19" y="17" width="6" height="9" fill="#B0500F"/>
  <!-- CI whiskers -->
  <g stroke="#2E2313" stroke-width="1.3">
    <line x1="10" y1="9" x2="10" y2="15"/>
    <line x1="8.4" y1="9" x2="11.6" y2="9"/>
    <line x1="8.4" y1="15" x2="11.6" y2="15"/>
    <line x1="22" y1="14" x2="22" y2="20"/>
    <line x1="20.4" y1="14" x2="23.6" y2="14"/>
    <line x1="20.4" y1="20" x2="23.6" y2="20"/>
  </g>
  <text x="16" y="10.5" font-family="Georgia, serif" font-size="9"
        font-style="italic" fill="#7A3E10"
        text-anchor="middle">Z</text>
</svg>
