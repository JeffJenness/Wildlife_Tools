<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Classification Accuracy: an error matrix with a strong
       diagonal and a raised kappa mark. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <!-- 4x4 matrix grid -->
  <g stroke="#9AAFC0" stroke-width="1.0" fill="none">
    <rect x="5" y="7" width="20" height="20"/>
    <line x1="10" y1="7" x2="10" y2="27"/>
    <line x1="15" y1="7" x2="15" y2="27"/>
    <line x1="20" y1="7" x2="20" y2="27"/>
    <line x1="5" y1="12" x2="25" y2="12"/>
    <line x1="5" y1="17" x2="25" y2="17"/>
    <line x1="5" y1="22" x2="25" y2="22"/>
  </g>
  <!-- agreement diagonal -->
  <g fill="#2E6B8A">
    <rect x="5.7" y="7.7" width="3.6" height="3.6"/>
    <rect x="10.7" y="12.7" width="3.6" height="3.6"/>
    <rect x="15.7" y="17.7" width="3.6" height="3.6"/>
    <rect x="20.7" y="22.7" width="3.6" height="3.6"/>
  </g>
  <!-- a few off-diagonal errors -->
  <g fill="#B0500F" fill-opacity="0.55">
    <rect x="16.2" y="8.2" width="2.6" height="2.6"/>
    <rect x="6.2" y="18.2" width="2.6" height="2.6"/>
  </g>
  <!-- kappa -->
  <text x="26.5" y="9.5" font-family="Georgia, serif"
        font-size="10" font-style="italic" fill="#7A3E10"
        text-anchor="middle">&#954;</text>
</svg>
