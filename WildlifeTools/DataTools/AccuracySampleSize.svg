<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Accuracy Sample Size: sample points over a classified map
       with an n = ? tag. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <!-- classified map patches -->
  <path d="M 4 6 L 17 6 L 17 15 L 4 15 Z" fill="#CFE6F2"/>
  <path d="M 17 6 L 28 6 L 28 19 L 17 19 Z" fill="#EAF2E4"/>
  <path d="M 4 15 L 17 15 L 17 19 L 28 19 L 28 28 L 4 28 Z"
        fill="#E8DFC8"/>
  <g fill="none" stroke="#9AAFC0" stroke-width="1.0">
    <path d="M 4 6 L 28 6 L 28 28 L 4 28 Z"/>
    <path d="M 17 6 L 17 19 L 28 19"/>
    <path d="M 4 15 L 17 15"/>
  </g>
  <!-- sample points -->
  <g fill="#B0500F">
    <circle cx="8" cy="10" r="1.4"/>
    <circle cx="13" cy="12.5" r="1.4"/>
    <circle cx="21" cy="9" r="1.4"/>
    <circle cx="25" cy="15" r="1.4"/>
    <circle cx="9" cy="21" r="1.4"/>
    <circle cx="15" cy="24.5" r="1.4"/>
    <circle cx="22" cy="23" r="1.4"/>
  </g>
  <!-- n = ? -->
  <rect x="18.5" y="24.2" width="9.4" height="6.2" rx="1.2"
        fill="#FFFFFF" stroke="#7A3E10" stroke-width="1.0"/>
  <text x="23.2" y="29" font-family="Georgia, serif" font-size="5.4"
        font-style="italic" fill="#7A3E10"
        text-anchor="middle">n = ?</text>
</svg>
