<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Longest Line in Polygon (Fetch): a lake with an island, crossed
       by its longest interior straight line (the fetch), which routes
       clear of the island. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <polygon points="4.2,13.0 9.0,5.0 18.5,3.8 27.6,8.4 28.4,17.0 23.0,26.6 12.4,27.8 5.2,22.2"
           fill="#CFE6F2" stroke="#2E6B8A" stroke-width="1.6"/>
  <polygon points="13.5,12.0 17.5,10.6 19.6,13.4 16.8,16.2 13.8,15.0"
           fill="#EAF2E4" stroke="#2E6B8A" stroke-width="1.2"/>
  <line x1="6.2" y1="23.2" x2="27.2" y2="9.0"
        stroke="#B0500F" stroke-width="2.0" stroke-linecap="round"/>
  <circle cx="6.2" cy="23.2" r="1.6" fill="#B0500F"/>
  <circle cx="27.2" cy="9.0" r="1.6" fill="#B0500F"/>
</svg>
