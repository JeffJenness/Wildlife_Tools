<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Radiating Lines and Points: a fan of evenly spaced rays from a
       central origin point, endpoints marked; one ray cut short by a
       barrier line. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <!-- barrier polyline (north-east), truncating one ray -->
  <polyline points="19.0,3.6 23.4,8.4 28.4,10.6"
            fill="none" stroke="#2E6B8A" stroke-width="1.8"
            stroke-linecap="round"/>
  <!-- eight rays from the origin -->
  <g stroke="#B0500F" stroke-width="1.8" stroke-linecap="round">
    <line x1="16" y1="16" x2="16"    y2="5"/>
    <line x1="16" y1="16" x2="21.2" y2="10.8"/>
    <line x1="16" y1="16" x2="27"   y2="16"/>
    <line x1="16" y1="16" x2="23.8" y2="23.8"/>
    <line x1="16" y1="16" x2="16"   y2="27"/>
    <line x1="16" y1="16" x2="8.2"  y2="23.8"/>
    <line x1="16" y1="16" x2="5"    y2="16"/>
    <line x1="16" y1="16" x2="8.2"  y2="8.2"/>
  </g>
  <!-- endpoints -->
  <g fill="#B0500F">
    <circle cx="16"   cy="5"    r="1.5"/>
    <circle cx="21.2" cy="10.8" r="1.5"/>
    <circle cx="27"   cy="16"   r="1.5"/>
    <circle cx="23.8" cy="23.8" r="1.5"/>
    <circle cx="16"   cy="27"   r="1.5"/>
    <circle cx="8.2"  cy="23.8" r="1.5"/>
    <circle cx="5"    cy="16"   r="1.5"/>
    <circle cx="8.2"  cy="8.2"  r="1.5"/>
  </g>
  <!-- origin -->
  <circle cx="16" cy="16" r="2.2" fill="#7A3E10"
          stroke="#FFFFFF" stroke-width="0.8"/>
</svg>
