<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Maximum Inscribed Geometry: an irregular polygon holding its
       largest inscribed circle and a rotated inscribed rectangle. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <polygon points="4.0,12.0 8.5,4.5 19.0,3.6 28.2,8.8 28.6,18.4 22.5,27.4 11.0,28.2 4.6,21.5"
           fill="#EAF2E4" stroke="#2E6B8A" stroke-width="1.6"/>
  <!-- inscribed rotated rectangle -->
  <polygon points="8.6,10.4 22.6,7.4 24.4,15.8 10.4,18.8"
           fill="none" stroke="#7A3E10" stroke-width="1.6"/>
  <!-- inscribed circle -->
  <circle cx="15.6" cy="18.2" r="8.0"
          fill="#CFE6F2" fill-opacity="0.55"
          stroke="#B0500F" stroke-width="1.9"/>
  <circle cx="15.6" cy="18.2" r="1.4" fill="#B0500F"/>
</svg>
