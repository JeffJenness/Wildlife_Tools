<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Concave Hull: a cloud of points with a concave outline hugging
       them, versus the convex hull's dashed bridge across the bay. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <!-- dashed convex-hull bridge across the concavity -->
  <line x1="24.5" y1="5.5" x2="24.5" y2="26.5"
        stroke="#9AAFC0" stroke-width="1.4"
        stroke-dasharray="2.4,2.2"/>
  <!-- concave hull: a C-shaped outline -->
  <path d="M 24.5 5.5
           C 12 2.5, 3.5 8, 3.5 16
           C 3.5 24, 12 29.5, 24.5 26.5
           C 18 23, 12.5 20.5, 12.5 16
           C 12.5 11.5, 18 9, 24.5 5.5 Z"
        fill="#EAF2E4" stroke="#2E6B8A" stroke-width="1.7"/>
  <!-- the points -->
  <g fill="#B0500F">
    <circle cx="23.2" cy="6.8"  r="1.25"/>
    <circle cx="16.5" cy="6.6"  r="1.25"/>
    <circle cx="10.5" cy="8.4"  r="1.25"/>
    <circle cx="6.6"  cy="12.2" r="1.25"/>
    <circle cx="6.2"  cy="17.6" r="1.25"/>
    <circle cx="8.6"  cy="22.6" r="1.25"/>
    <circle cx="13.6" cy="25.6" r="1.25"/>
    <circle cx="19.6" cy="26.4" r="1.25"/>
    <circle cx="23.4" cy="25.3" r="1.25"/>
    <circle cx="16.2" cy="21.9" r="1.25"/>
    <circle cx="14.9" cy="16.2" r="1.25"/>
    <circle cx="16.6" cy="10.8" r="1.25"/>
    <circle cx="10.8" cy="13.0" r="1.25"/>
    <circle cx="10.6" cy="19.2" r="1.25"/>
  </g>
</svg>
