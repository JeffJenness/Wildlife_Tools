        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <g stroke="#2E6B8A" stroke-width="1.1" fill="none">
    <path d="M 1.5 9.2 L 6.4 6.6 L 11.2 9.2 L 11.2 14.6 L 6.4 17.2 L 1.5 14.6"/>
    <path d="M 11.2 9.2 L 16.0 6.6 L 20.8 9.2 L 20.8 14.6 L 16.0 17.2 L 11.2 14.6"/>
    <path d="M 20.8 9.2 L 25.6 6.6 L 30.5 9.2"/>
    <path d="M 20.8 14.6 L 25.6 17.2 L 30.5 14.6"/>
    <path d="M 6.4 17.2 L 6.4 22.6 L 11.2 25.2 L 16.0 22.6 L 16.0 17.2"/>
    <path d="M 16.0 22.6 L 20.8 25.2 L 25.6 22.6 L 25.6 17.2"/>
    <path d="M 6.4 6.6 L 6.4 1.5 M 16.0 6.6 L 16.0 1.5 M 25.6 6.6 L 25.6 1.5"/>
