    <circle cx="16.0" cy="11.9" r="1.6"/>
    <circle cx="25.6" cy="11.9" r="1.6"/>
    <circle cx="11.2" cy="20.4" r="1.6"/>
    <circle cx="20.8" cy="20.4" r="1.6"/>
  </g>
</svg>
