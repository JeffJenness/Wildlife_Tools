<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Repeating Shapes: four pattern quadrants (triangles, hexagons,
       squares, circles). -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="1.5"
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <g stroke="#2E6B8A" stroke-width="1.0" fill="none">
    <!-- triangles (top-left) -->
    <path d="M 1.5 8.5 L 5.2 2.2 L 8.9 8.5 Z M 8.9 8.5 L 12.6 2.2 L 16.0 8.0 M 5.2 2.2 L 8.9 8.5 M 1.5 15.0 L 5.2 8.5 L 8.9 15.0 Z M 8.9 15.0 L 12.6 8.5 L 16.0 14.5"/>
    <!-- hexagons (top-right) -->
    <path d="M 19.0 5.2 L 21.2 2.0 M 19.0 5.2 L 21.2 8.4 L 25.4 8.4 L 27.6 5.2 L 25.4 2.0 L 21.2 2.0 M 25.4 8.4 L 27.6 11.6 M 27.6 5.2 L 30.5 5.2 M 21.2 8.4 L 19.0 11.6 L 21.2 14.8 L 25.4 14.8 L 27.6 11.6 L 30.5 11.6"/>
    <!-- squares (bottom-left) -->
    <path d="M 1.5 17.5 H 15.5 M 1.5 22.0 H 15.5 M 1.5 26.5 H 15.5 M 5.8 17.5 V 30.5 M 10.6 17.5 V 30.5 M 15.5 17.5 V 30.5"/>
  </g>
  <!-- circles (bottom-right) -->
  <g fill="none" stroke="#B0500F" stroke-width="1.2">
    <circle cx="20.6" cy="20.3" r="1.9"/>
    <circle cx="27.4" cy="20.3" r="1.9"/>
    <circle cx="24.0" cy="25.6" r="1.9"/>
    <circle cx="20.6" cy="30.0" r="1.9"/>
    <circle cx="27.4" cy="30.0" r="1.9"/>
  </g>
</svg>
