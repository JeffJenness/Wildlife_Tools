<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Companion to LandFacet.svg: the same 5x5 facet mosaic, but recolored as a
       density surface for ONE facet (a single hue, dark where that facet fills
       the neighborhood and pale where it is sparse), with the circular moving
       window drawn over it. -->
