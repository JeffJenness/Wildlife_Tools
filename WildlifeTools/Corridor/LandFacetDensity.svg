  <rect x="13.50" y="25.30" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>
  <rect x="19.40" y="25.30" width="5.00" height="5.00" rx="1" ry="1" fill="#A9D3EE"/>
