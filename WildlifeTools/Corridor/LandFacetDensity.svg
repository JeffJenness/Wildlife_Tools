  <rect x="7.60" y="1.70" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>
  <rect x="13.50" y="1.70" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>
  <rect x="19.40" y="1.70" width="5.00" height="5.00" rx="1" ry="1" fill="#A9D3EE"/>
  <rect x="25.30" y="1.70" width="5.00" height="5.00" rx="1" ry="1" fill="#A9D3EE"/>

  <rect x="1.70" y="7.60" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>
  <rect x="7.60" y="7.60" width="5.00" height="5.00" rx="1" ry="1" fill="#4A9FD4"/>
  <rect x="13.50" y="7.60" width="5.00" height="5.00" rx="1" ry="1" fill="#216FA8"/>
  <rect x="19.40" y="7.60" width="5.00" height="5.00" rx="1" ry="1" fill="#4A9FD4"/>
  <rect x="25.30" y="7.60" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>

  <rect x="1.70" y="13.50" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>
  <rect x="7.60" y="13.50" width="5.00" height="5.00" rx="1" ry="1" fill="#216FA8"/>
  <rect x="13.50" y="13.50" width="5.00" height="5.00" rx="1" ry="1" fill="#12496F"/>
  <rect x="19.40" y="13.50" width="5.00" height="5.00" rx="1" ry="1" fill="#216FA8"/>
  <rect x="25.30" y="13.50" width="5.00" height="5.00" rx="1" ry="1" fill="#7FBBE3"/>

  <rect x="1.70" y="19.40" width="5.00" height="5.00" rx="1" ry="1" fill="#A9D3EE"/>
  <rect x="7.60" y="19.40" width="5.00" height="5.00" rx="1" ry="1" fill="#4A9FD4"/>
