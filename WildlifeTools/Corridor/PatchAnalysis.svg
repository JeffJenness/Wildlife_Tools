<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Patch Analysis: two Wildland Blocks joined by a route that hops
       between stepping-stone habitat patches inside the corridor -- the
       dashed connectors are the gaps the animal must cross, the longest
       one being the critical gap. -->
  <path d="M 24 8 C 20 12, 17 14, 15.5 15.5 C 13.5 17.5, 10 20, 8 24"
        fill="none" stroke="#E8912E" stroke-width="8"
        stroke-linecap="round" opacity="0.45"/>
  <rect x="1.2" y="1.2" width="10" height="10" rx="2.2"
        fill="#EAF3E4" stroke="#4E7A3A" stroke-width="1.8"/>
  <rect x="20.8" y="20.8" width="10" height="10" rx="2.2"
        fill="#EAF3E4" stroke="#4E7A3A" stroke-width="1.8"/>
  <path d="M 9.5 9.5 L 13 13 M 19 19 L 22.5 22.5 M 15.2 15.2 L 16.8 16.8"
        stroke="#B03A2E" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="2.2 1.8"/>
  <path d="M 13.2 11.2 L 15.4 12.2 L 16.2 14.4 L 14.4 15.8 L 12.2 15.0
           L 11.8 12.6 Z"
        fill="#7CB65C" stroke="#4E7A3A" stroke-width="1.2"/>
  <path d="M 17.4 16.6 L 19.8 17.2 L 20.6 19.4 L 18.8 20.8 L 16.6 20.0
           L 16.2 17.8 Z"
        fill="#7CB65C" stroke="#4E7A3A" stroke-width="1.2"/>
</svg>
