<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Bottleneck Analysis: two Wildland Blocks joined by a corridor that
       necks down to a narrow throat mid-way -- the bottleneck, marked
       red -- suggesting the width profile the tool graphs. -->
  <rect x="1.2" y="1.2" width="10" height="10" rx="2.2"
        fill="#EAF3E4" stroke="#4E7A3A" stroke-width="1.8"/>
  <rect x="20.8" y="20.8" width="10" height="10" rx="2.2"
        fill="#EAF3E4" stroke="#4E7A3A" stroke-width="1.8"/>
  <path d="M 8.5 9.5 C 13 12.5, 14.2 13.2, 15.2 15.2
           C 16.2 17.2, 18.5 18.5, 23 23"
        fill="none" stroke="#E8912E" stroke-width="7"
        stroke-linecap="round" opacity="0.5"/>
  <path d="M 8.5 9.5 C 13 12.5, 14.2 13.2, 15.2 15.2
           C 16.2 17.2, 18.5 18.5, 23 23"
        fill="none" stroke="#E8912E" stroke-width="2.6"
        stroke-linecap="round"/>
  <circle cx="15.7" cy="15.9" r="3.6" fill="none" stroke="#B03A2E"
          stroke-width="2"/>
  <path d="M 12.9 18.7 L 11 20.6 M 18.5 13.1 L 20.4 11.2"
        stroke="#B03A2E" stroke-width="2" stroke-linecap="round"/>
</svg>
