<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- LoCoH Parameter Explorer: three isopleth-area curves rising to a
       plateau over a swept parameter, with the heuristic marked -->
  <!-- axes -->
  <path d="M 5 3.5 L 5 27 L 29.5 27" fill="none" stroke="#3a3a3a"
        stroke-width="1.8" stroke-linecap="round"/>
  <!-- dashed heuristic line -->
  <path d="M 17 5 L 17 26.5" fill="none" stroke="#8a8a8a"
        stroke-width="1.3" stroke-dasharray="2.2,2.0"/>
  <!-- 95% curve (green, top) -->
  <path d="M 6.5 24.5 C 10 12, 13 8.5, 17 7.5 C 21 6.8, 25 6.6, 28.5 6.4"
        fill="none" stroke="#009e73" stroke-width="2.4"
        stroke-linecap="round"/>
  <!-- 75% curve (orange, middle) -->
  <path d="M 6.5 25.5 C 10 17, 13 13.5, 17 12.6 C 21 12.0, 25 11.8, 28.5 11.7"
        fill="none" stroke="#e69f00" stroke-width="2.4"
        stroke-linecap="round"/>
  <!-- 50% curve (blue, bottom) -->
  <path d="M 6.5 26.2 C 10 21.5, 13 18.8, 17 18.1 C 21 17.6, 25 17.5, 28.5 17.4"
        fill="none" stroke="#0072b2" stroke-width="2.4"
        stroke-linecap="round"/>
</svg>
